<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTSI AI Strategic Intelligence Dashboard</title>
<style>
:root {
  --maroon: #7a0019;
  --maroon-dark: #5c0013;
  --gold: #ffcc33;
  --gold-muted: #f5e6b8;
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50: #f8fafc;
  --white: #ffffff;
  --red-600: #dc2626;
  --amber-500: #f59e0b;
  --green-600: #16a34a;
  --green-50: #f0fdf4;
  --blue-600: #2563eb;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Georgia, 'Times New Roman', serif;
  background: var(--slate-50);
  color: var(--slate-800);
  line-height: 1.6;
}

/* === TOP BAR === */
.topbar {
  background: var(--maroon);
  color: var(--white);
  padding: 0 2rem;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: baseline; gap: 1rem; }
.topbar-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.topbar-sub {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.7rem; color: var(--gold-muted); letter-spacing: 0.03em;
}
.topbar-right {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.7rem; color: var(--gold-muted);
}

/* === LAYOUT === */
.layout { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* === DATE HEADER === */
.date-header {
  display: flex; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; gap: 0.75rem;
  margin-bottom: 1.75rem; padding-bottom: 0.85rem;
  border-bottom: 2px solid var(--maroon);
}
.date-header h1 { font-size: 1.4rem; color: var(--slate-900); font-weight: 400; }
.date-header h1 b { font-weight: 700; }
.date-nav { display: flex; gap: 0.4rem; align-items: center; }
.date-btn {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.75rem; padding: 0.3rem 0.7rem;
  border: 1px solid var(--slate-300); border-radius: 4px;
  background: var(--white); color: var(--slate-600);
  cursor: pointer; transition: all 0.12s;
}
.date-btn:hover { border-color: var(--maroon); color: var(--maroon); }
.date-btn.active { background: var(--maroon); color: var(--white); border-color: var(--maroon); }

/* === STATS === */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.85rem; margin-bottom: 1.75rem; }
.stat {
  background: var(--white); border: 1px solid var(--slate-200);
  border-radius: 6px; padding: 0.85rem 1rem;
}
.stat-label {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--slate-500); margin-bottom: 0.2rem;
}
.stat-val {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 1.4rem; font-weight: 700; color: var(--slate-900);
}
.stat-val.red { color: var(--red-600); }
.stat-val.green { color: var(--green-600); }

/* === FILTERS === */
.filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
.chip {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.72rem; font-weight: 500;
  padding: 0.3rem 0.8rem; border-radius: 18px;
  border: 1px solid var(--slate-300); background: var(--white);
  color: var(--slate-600); cursor: pointer;
  transition: all 0.12s; user-select: none;
}
.chip:hover { border-color: var(--slate-500); }
.chip.on { background: var(--slate-800); color: var(--white); border-color: var(--slate-800); }
.chip.clear { font-style: italic; color: var(--slate-400); }

/* === DOMAIN === */
.domain { margin-bottom: 2.25rem; }
.domain-hdr {
  display: flex; align-items: center; gap: 0.65rem;
  margin-bottom: 1rem; padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--slate-200);
}
.domain-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.domain-name {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--slate-600);
}
.domain-ct {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.62rem; color: var(--slate-400); margin-left: auto;
}

/* === ITEM CARD === */
.card {
  background: var(--white); border: 1px solid var(--slate-200);
  border-radius: 6px; padding: 1.25rem 1.4rem;
  margin-bottom: 0.75rem; cursor: pointer;
  transition: border-color 0.12s;
}
.card:hover { border-color: var(--slate-400); }
.card.open { border-color: var(--maroon); border-left: 3px solid var(--maroon); }
.card-top { display: flex; align-items: flex-start; gap: 0.7rem; }
.pdot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; margin-top: 0.45rem;
}
.pdot.high { background: var(--red-600); }
.pdot.medium { background: var(--amber-500); }
.pdot.low { background: var(--slate-400); }
.card-hl { font-size: 1rem; font-weight: 600; color: var(--slate-900); line-height: 1.4; flex: 1; }
.card-src {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.68rem; color: var(--slate-500);
  text-align: right; flex-shrink: 0; line-height: 1.4; margin-top: 0.1rem;
}
.card-src a { color: var(--blue-600); text-decoration: none; }
.card-src a:hover { text-decoration: underline; }
.card-summary { margin-top: 0.6rem; padding-left: 1.45rem; color: var(--slate-700); font-size: 0.92rem; }
.card-hint {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.68rem; color: var(--slate-400);
  margin-top: 0.4rem; padding-left: 1.45rem;
}
.card-details { margin-top: 0.85rem; padding-left: 1.45rem; }
.dblock {
  margin-top: 0.65rem; padding: 0.75rem 0.9rem;
  border-radius: 4px; font-size: 0.88rem; line-height: 1.55;
}
.dblock.why { background: #fef9ee; border-left: 3px solid var(--gold); }
.dblock.act { background: var(--green-50); border-left: 3px solid var(--green-600); }
.dblock-label {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 0.3rem;
}
.dblock.why .dblock-label { color: #92400e; }
.dblock.act .dblock-label { color: #166534; }

/* === FOOTER === */
.digest-footer { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--slate-200); }
.foot-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--slate-500); margin-bottom: 0.4rem;
}
.foot-list { font-size: 0.82rem; color: var(--slate-600); margin-bottom: 1rem; padding-left: 1rem; }
.foot-list li { margin-bottom: 0.1rem; }

/* === EMPTY === */
.empty { text-align: center; padding: 4rem 2rem; color: var(--slate-500); }
.empty p { font-size: 1rem; margin-bottom: 0.4rem; }
.empty .sub {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.8rem;
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .layout { padding: 1.25rem 1rem 3rem; }
  .date-header { flex-direction: column; }
  .topbar { padding: 0 1rem; }
}
@media (max-width: 480px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">CTSI AI Strategic Intelligence</span>
    <span class="topbar-sub">Discovery &amp; Translation</span>
  </div>
  <div class="topbar-right" id="archive-count"></div>
</div>

<div class="layout">
  <div class="date-header">
    <h1 id="digest-title"></h1>
    <div class="date-nav" id="date-nav"></div>
  </div>
  <div class="stats" id="stats-bar"></div>
  <div class="filters" id="filter-bar"></div>
  <div id="content"></div>
  <div class="digest-footer" id="footer"></div>
</div>

<script>
var DIGEST_DATA = [];

var DCOLORS = {
  "Institutional Strategy": "#7a0019",
  "Federal Policy Signals": "#2563eb",
  "Responsible AI & Ethics": "#7c3aed",
  "AI in Clinical & Translational Research": "#0d9488",
  "AI Tool & Capability Developments": "#475569"
};

var state = { dateIdx: 0, activeFilters: {}, expanded: {} };

function esc(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function fmtDate(ds) {
  var d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function fmtShort(ds) {
  var d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function cur() { return DIGEST_DATA[state.dateIdx] || null; }

function computeStats(digest) {
  var total = 0, high = 0, action = 0;
  digest.domains.forEach(function(d) {
    d.items.forEach(function(it) {
      total++;
      if (it.priority === 'high') high++;
      if (it.actionImplication) action++;
    });
  });
  return { total: total, high: high, action: action, domains: digest.domains.length };
}

function render() {
  var digest = cur();
  if (!digest) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><p>No digest data available yet.</p><p class="sub">The daily scheduled task will populate this dashboard.</p></div>';
    return;
  }

  document.getElementById('archive-count').textContent =
    DIGEST_DATA.length + ' digest' + (DIGEST_DATA.length !== 1 ? 's' : '') + ' archived';

  document.getElementById('digest-title').innerHTML =
    '<b>Digest</b> \u2014 ' + esc(fmtDate(digest.date));

  var navHtml = '';
  if (DIGEST_DATA.length > 1) {
    DIGEST_DATA.forEach(function(d, i) {
      navHtml += '<button class="date-btn' + (i === state.dateIdx ? ' active' : '') +
        '" onclick="selectDate(' + i + ')">' + esc(fmtShort(d.date)) + '</button>';
    });
  }
  document.getElementById('date-nav').innerHTML = navHtml;

  var s = computeStats(digest);
  document.getElementById('stats-bar').innerHTML =
    '<div class="stat"><div class="stat-label">Items Today</div><div class="stat-val">' + s.total + '</div></div>' +
    '<div class="stat"><div class="stat-label">High Priority</div><div class="stat-val' + (s.high > 0 ? ' red' : '') + '">' + s.high + '</div></div>' +
    '<div class="stat"><div class="stat-label">Action Items</div><div class="stat-val' + (s.action > 0 ? ' green' : '') + '">' + s.action + '</div></div>' +
    '<div class="stat"><div class="stat-label">Domains Covered</div><div class="stat-val">' + s.domains + '</div></div>';

  var allNames = digest.domains.map(function(d) { return d.name; });
  var filterHtml = '';
  allNames.forEach(function(nm) {
    var escaped = esc(nm).replace(/'/g, "\\'");
    filterHtml += '<button class="chip' + (state.activeFilters[nm] ? ' on' : '') +
      '" onclick="toggleFilter(\'' + escaped + '\')">' + esc(nm) + '</button>';
  });
  var anyOn = Object.keys(state.activeFilters).some(function(k) { return state.activeFilters[k]; });
  if (anyOn) {
    filterHtml += '<button class="chip clear" onclick="clearFilters()">Clear filters</button>';
  }
  document.getElementById('filter-bar').innerHTML = filterHtml;

  var domains = digest.domains;
  if (anyOn) {
    domains = domains.filter(function(d) { return state.activeFilters[d.name]; });
  }

  var html = '';
  domains.forEach(function(domain, di) {
    var color = DCOLORS[domain.name] || '#64748b';
    html += '<div class="domain">';
    html += '<div class="domain-hdr">';
    html += '<div class="domain-dot" style="background:' + color + '"></div>';
    html += '<span class="domain-name">' + esc(domain.name) + '</span>';
    html += '<span class="domain-ct">' + domain.items.length + ' item' + (domain.items.length !== 1 ? 's' : '') + '</span>';
    html += '</div>';

    domain.items.forEach(function(item, ii) {
      var key = di + '-' + ii;
      var isOpen = state.expanded[key];
      html += '<div class="card' + (isOpen ? ' open' : '') + '" onclick="toggleCard(\'' + key + '\')">';
      html += '<div class="card-top">';
      html += '<div class="pdot ' + item.priority + '" title="' + esc(item.priority) + ' priority"></div>';
      html += '<div class="card-hl">' + esc(item.headline) + '</div>';
      html += '<div class="card-src"><a href="' + esc(item.sourceUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(item.source) + '</a><br>' + esc(item.sourceDate) + '</div>';
      html += '</div>';
      html += '<div class="card-summary">' + esc(item.summary) + '</div>';

      if (isOpen) {
        html += '<div class="card-details">';
        html += '<div class="dblock why"><div class="dblock-label">Why This Matters for CTSI</div>' + esc(item.whyItMatters) + '</div>';
        if (item.actionImplication) {
          html += '<div class="dblock act"><div class="dblock-label">Action Implication</div>' + esc(item.actionImplication) + '</div>';
        }
        html += '</div>';
      } else {
        html += '<div class="card-hint">Click to expand analysis</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('content').innerHTML = html;

  var fhtml = '';
  if (digest.sourcesConsulted && digest.sourcesConsulted.length) {
    fhtml += '<div class="foot-title">Sources Consulted</div><ul class="foot-list">';
    digest.sourcesConsulted.forEach(function(s) { fhtml += '<li>' + esc(s) + '</li>'; });
    fhtml += '</ul>';
  }
  if (digest.confidenceNotes && digest.confidenceNotes.length) {
    fhtml += '<div class="foot-title">Confidence Notes</div><ul class="foot-list">';
    digest.confidenceNotes.forEach(function(n) { fhtml += '<li>' + esc(n) + '</li>'; });
    fhtml += '</ul>';
  }
  document.getElementById('footer').innerHTML = fhtml;
}

function selectDate(i) { state.dateIdx = i; state.expanded = {}; render(); }
function toggleFilter(name) {
  state.activeFilters[name] = !state.activeFilters[name];
  if (!state.activeFilters[name]) delete state.activeFilters[name];
  render();
}
function clearFilters() { state.activeFilters = {}; render(); }
function toggleCard(key) { state.expanded[key] = !state.expanded[key]; render(); }

// Load data from JSON file (works when served from a web server)
fetch('digests.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    DIGEST_DATA = data;
    DIGEST_DATA.sort(function(a, b) { return b.date.localeCompare(a.date); });
    render();
  })
  .catch(function(err) {
    console.error('Failed to load digest data:', err);
    render();
  });
</script>
</body>
</html>
